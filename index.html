<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Текст.ру и VK Реклама на специальных условиях</title>
    <meta
      name="description"
      content="Специальные условия на ПРО-аккаунт Текст.ру (−20%) и Премиум-подписку VK Рекламы (−50%): создавайте контент и запускайте рекламу в одном месте."
    />

    <!--
      ⚠ ВРЕМЕННЫЙ ДОМЕН: og:url и абсолютный URL og:image/twitter:image сейчас указывают на тестовый домен
      Vercel (landing-text-vk.vercel.app) для проверки Social Preview. Когда подключите настоящий домен —
      поменять все 3 вхождения (og:url выше + og:image/twitter:image ниже).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Текст.ру × VK Реклама" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://landing-text-vk.vercel.app/" />
    <meta property="og:title" content="Текст.ру и VK Реклама на специальных условиях" />
    <meta
      property="og:description"
      content="Специальные условия на ПРО-аккаунт Текст.ру (−20%) и Премиум-подписку VK Рекламы (−50%): создавайте контент и запускайте рекламу в одном месте."
    />
    <meta property="og:image" content="https://landing-text-vk.vercel.app/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Текст.ру и VK Реклама на специальных условиях" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Текст.ру и VK Реклама на специальных условиях" />
    <meta
      name="twitter:description"
      content="Специальные условия на ПРО-аккаунт Текст.ру (−20%) и Премиум-подписку VK Рекламы (−50%): создавайте контент и запускайте рекламу в одном месте."
    />
    <meta name="twitter:image" content="https://landing-text-vk.vercel.app/social-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
